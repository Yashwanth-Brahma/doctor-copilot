[project]
name = "doctor-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
doctor-copilot = "doctor_copilot:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
